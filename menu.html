<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyhan Cafe - Menü</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,600;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Harici CSS Sayfamızı Bağlıyoruz -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- YAN AÇILIR MENÜ (SIDEBAR) -->
    <div id="side-menu" class="fixed inset-0 z-50 pointer-events-none">
        <div id="menu-overlay" onclick="toggleMenu()" class="absolute inset-0 bg-black/80 opacity-0 transition-opacity duration-300 pointer-events-none"></div>
        <div id="menu-content" class="card absolute right-0 top-0 bottom-0 w-64 p-6 transform translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-8">
                    <h2 class="font-serif text-2xl italic">Seyhan Cafe</h2>
                    <button onclick="toggleMenu()" class="text-3xl transition bg-transparent border-0!">&times;</button>
                </div>
                <nav class="flex flex-col gap-4">
                    <a id="nav-home" href="index.html" class="flex items-center gap-2 py-2 transition font-medium tracking-wide">☕ Ana Sayfa</a>
                    <a id="nav-menu" href="menu.html" class="flex items-center gap-2 py-2 text-white transition font-bold tracking-wide">📖 Menü</a>
                    <hr class="border-white/5 my-4">
                    <div class="py-2 text-xs p-3 rounded-xl">
                        <span class="block font-bold mb-1">📶 Wi-Fi Şifresi:</span>
                        <span class="text-white font-mono text-sm">seyhancafe44</span>
                    </div>
                </nav>
            </div>
            <div class="text-[10px] text-white/20 text-center border-t border-white/5 pt-4 tracking-widest">
                #SEYHANCOFFEE
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-md mx-auto w-full flex-1 flex flex-col relative">

        <!-- Hamburger Menü Butonu -->
        <button onclick="toggleMenu()" class="absolute top-4 right-4 z-30 p-2.5 rounded-xl active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- ÜST BANNER -->
        <header class="py-10 px-4 text-center rounded-b-[2.5rem] relative overflow-hidden">
            <div class="relative z-10">
                <h1 class="font-serif text-4xl font-bold tracking-wide italic">Seyhan Cafe</h1>
                <p class="text-xs opacity-60 mt-2 tracking-widest uppercase">ÜSKÜDAR'IN KAHVE NOKTASI</p>

                <div class="flex items-center justify-center gap-2 mt-3 opacity-30">
                    <span class="h-px w-8 bg-current"></span>
                    <span class="text-[8px]">●</span>
                    <span class="h-px w-8 bg-current"></span>
                </div>

                <div id="table-badge" class="hidden inline-block mt-4 table-tag text-xs font-semibold px-4 py-1.5 rounded-full">
                    Masa: <span id="table-number">-</span>
                </div>
            </div>
        </header>

        <!-- ARAMA KUTUSU -->
        <div class="px-4 mt-1 mb-4">
            <input type="text" id="search-input" placeholder="🔍 Ürün ara..."
                   class="search-input w-full px-4 py-3 rounded-xl text-sm outline-none transition"
                   oninput="handleSearch(this.value)">
        </div>

        <!-- KATEGORİ SEÇİCİLER -->
        <div class="relative mb-6">
            <nav class="category-nav flex gap-2.5 px-4 overflow-x-auto no-scrollbar w-full">
                <button onclick="filterCategory('all', this)" class="active-cat font-bold px-5 py-2.5 rounded-xl text-xs tracking-widest uppercase shrink-0 transition">Hepsi</button>
                <button onclick="filterCategory('kahve', this)" class="font-semibold px-5 py-2.5 rounded-xl text-xs tracking-widest uppercase shrink-0 transition">☕ Kahveler</button>
                <button onclick="filterCategory('icecek', this)" class="font-semibold px-5 py-2.5 rounded-xl text-xs tracking-widest uppercase shrink-0 transition">🥤 İçecekler</button>
                <button onclick="filterCategory('yiyecek', this)" class="font-semibold px-5 py-2.5 rounded-xl text-xs tracking-widest uppercase shrink-0 transition">🍽️ Yiyecekler</button>
            </nav>
            <div class="nav-fade pointer-events-none absolute top-0 right-0 bottom-0 w-10"></div>
        </div>

        <!-- MENÜ LİSTESİ -->
        <main class="px-4 pb-16 flex-1">
            <div id="menu-container" class="grid gap-4">
                <!-- JS kartları buraya dolduracak -->
            </div>
        </main>
    </div>

    <footer class="text-center text-[10px] opacity-40 tracking-wider pb-8 uppercase w-full">
        &copy; 2026 Seyhan Coffee Co.
    </footer>

    <script>
        const menuItems = [
            { id: 1, name: "Espresso", price: "180 TL", desc: "Özel harman çekirdeklerimizden gelen yoğun ve gövdeli İtalyan harikası.", cat: "kahve", img: "coffe.png" },
            { id: 2, name: "Filtre Kahve", price: "180 TL", desc: "Günün her saati taze, yumuşak içimli ve dengeli geleneksel siyah kahve.", cat: "kahve", img: "coffe.png" },
            { id: 3, name: "Americano", price: "180 TL", desc: "Double espresso özünün sıcak su ile mükemmel birleşimi.", cat: "kahve", img: "coffe.png" },
            { id: 4, name: "Cappuccino", price: "180 TL", desc: "Espresso, sıcak süt ve yoğun kadifemsi süt köpüğünün uyumu.", cat: "kahve", img: "coffe.png" },
            { id: 5, name: "Latte Macchiato", price: "180 TL", desc: "Bol sıcak süt ve süt köpüğünün üzerine yavaşça süzülen espresso katmanı.", cat: "kahve", img: "coffe.png" },
            { id: 6, name: "Iced Coffee", price: "180 TL", desc: "Bol buzlu, ferahlatıcı ve canlandırıcı soğuk filtre kahve.", cat: "kahve", img: "coffe.png" },
            { id: 7, name: "Iced Latte", price: "180 TL", desc: "Espresso, soğuk süt ve buz küplerinin yaz aylarına özel hafif uyumu.", cat: "kahve", img: "coffe.png" },
            { id: 8, name: "Çay", price: "30 TL", desc: "Taze demlenmiş geleneksel Türk çayı.", cat: "icecek", img: "https://www.drfirat.com/wp-content/uploads/2020/04/vagecilmez-cay-69241eebefa1f-900x400.webp" },
            { id: 9, name: "Su", price: "30 TL", desc: "Ferahlatıcı doğal kaynak suyu.", cat: "icecek", img: "su.png" },
            { id: 10, name: "Kola Grubu", price: "90 TL", desc: "Soğuk kutu içecek alternatifleri.", cat: "icecek", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500&auto=format&fit=crop&q=80" },
            { id: 11, name: "Gazoz Çeşitleri", price: "45 TL", desc: "Farklı aromalı serinletici yerel gazoz çeşitleri.", cat: "icecek", img: "https://atisbutikrestaurant.com.tr/wp-content/uploads/2021/07/meyveli-soda.jpg" },
            { id: 12, name: "Ayran", price: "30 TL", desc: "Soğuk ve ferahlatıcı geleneksel ayran.", cat: "icecek", img: "ayran.png" },
            { id: 13, name: "Sade Soda", price: "30 TL", desc: "Serinletici doğal maden suyu.", cat: "icecek", img: "Sadesoda.png" },
            { id: 14, name: "Menemen", price: "200 TL", desc: "Bol malzemeli, sıcak köy menemeni.", cat: "yiyecek", img: "https://d17wu0fn6x6rgz.cloudfront.net/img/w/tarif/ogt/ykvmayiswebsite23.webp" },
            { id: 15, name: "Köfte", price: "250 TL", desc: "Izgaradan taze çıkmış, nefis dükkan köftesi.", cat: "yiyecek", img: "köfte.png" },
            { id: 16, name: "Kahvaltı Tabağı", price: "250 TL", desc: "Zengin ve taze kahvaltılık çeşitleri.", cat: "yiyecek", img: "https://www.flashrestaurant.com.tr/wp-content/uploads/2012/06/DSC_0078.jpg" },
            { id: 17, name: "Kaşarlı Tost", price: "180 TL", desc: "Çıtır ekmek arasında eriyen nefis kaşar peyniri.", cat: "yiyecek", img: "https://ersiba.com.tr/wp-content/uploads/2016/05/kasarli-tost.png" },
            { id: 18, name: "Karışık Tost", price: "200 TL", desc: "Kasap sucuğu ve eriyen kaşar peynirinin muazzam uyumu.", cat: "yiyecek", img: "https://tarifmotoru.com/storage//webcovers/meals/3/546_picture_1765381947.png" }
        ];

        let currentCategory = 'all';
        let currentSearch = '';

        const urlParams = new URLSearchParams(window.location.search);
        const masaNo = urlParams.get('masa');
        if (masaNo) {
            document.getElementById('table-badge').classList.remove('hidden');
            document.getElementById('table-number').innerText = masaNo;
            document.getElementById('nav-home').href = `index.html?masa=${masaNo}`;
            document.getElementById('nav-menu').href = `menu.html?masa=${masaNo}`;
        }

        function getFilteredItems() {
            const search = currentSearch.trim().toLocaleLowerCase('tr');
            return menuItems.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.cat === currentCategory;
                const matchesSearch = search === '' || item.name.toLocaleLowerCase('tr').includes(search);
                return matchesCategory && matchesSearch;
            });
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-sm opacity-50 py-10">Aradığınız ürün bulunamadı.</p>`;
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="relative h-32 rounded-2xl overflow-hidden menu-card active:scale-[0.98] transition duration-200">
                    <img src="${item.img}" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-r from-black/85 via-black/60 to-black/20 z-10"></div>
                    <div class="absolute inset-0 z-20 p-4 flex justify-between items-center gap-4 text-white">
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-base tracking-wide">${item.name}</h3>
                            <p class="text-[11px] opacity-70 mt-1 leading-snug line-clamp-2 font-light">${item.desc}</p>
                        </div>
                        <div class="flex-shrink-0">
                            <span class="price-badge font-bold text-xs px-3 py-2 rounded-xl">
                                ${item.price}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateView() {
            renderMenu(getFilteredItems());
        }

        function filterCategory(category, btnEl) {
            currentCategory = category;
            document.querySelectorAll('.category-nav button').forEach(btn => btn.classList.remove('active-cat'));
            btnEl.classList.add('active-cat');
            updateView();
        }

        function handleSearch(value) {
            currentSearch = value;
            updateView();
        }

        function toggleMenu() {
            document.getElementById('menu-content').classList.toggle('translate-x-full');
        }

        updateView();
    </script>
</body>
</html>
