<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Dijital Menü</title>
    <!-- Modern tasarım için Tailwind CSS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts - Poppins (Modern yazı tipi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased">

    <!-- ÜST BANNER & KAFE ADI -->
    <header class="bg-neutral-900 text-white py-8 px-4 text-center rounded-b-3xl shadow-lg relative overflow-hidden">
        <div class="absolute inset-0 bg-black/40 z-0"></div> <!-- Karartma katmanı -->
        <div class="relative z-10">
            <h1 id="cafe-name" class="text-3xl font-bold tracking-wide">Liman Cafe & Bistro</h1>
            <p id="welcome-message" class="text-sm text-stone-300 mt-1">Dijital Menümüze Hoş Geldiniz</p>
            
            <!-- Masaya Özel Alan (URL'de masa varsa görünecek) -->
            <div id="table-badge" class="hidden inline-block mt-3 bg-amber-500 text-neutral-900 text-xs font-bold px-3 py-1 rounded-full shadow">
                Masa: <span id="table-number">-</span>
            </div>
        </div>
    </header>

    <!-- KATEGORİ BUTONLARI (Hızlı Erişim) -->
    <nav class="flex justify-center gap-2 my-6 px-4 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all')" class="bg-amber-500 text-neutral-900 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95">Hepsi</button>
        <button onclick="filterCategory('icecek')" class="bg-white text-stone-700 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95">İçecekler</button>
        <button onclick="filterCategory('tatli')" class="bg-white text-stone-700 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95">Tatlılar</button>
        <button onclick="filterCategory('yiyecek')" class="bg-white text-stone-700 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95">Atıştırmalıklar</button>
    </nav>

    <!-- MENÜ LİSTESİ -->
    <main class="max-w-md mx-auto px-4 pb-12">
        <div id="menu-container" class="grid gap-4">
            <!-- Ürünler JavaScript ile buraya dinamik gelecek -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-stone-400 pb-6">
        &copy; 2026 Dijital Menü Sistemi. Tüm hakları saklıdır.
    </footer>

    <!-- JAVASCRIPT: ÖZELLEŞTİRME VE VERİ YÖNETİMİ -->
    <script>
        // 1. MENÜ VERİLERİ (İstediğin gibi ekle/çıkar/değiştir)
        const menuItems = [
            { id: 1, name: "Çay", price: "30 TL", desc: "Geleneksel lezzet, lokum ile servis edilir.", cat: "icecek" },
            { id: 1, name: "Kahve", price: "100 TL", desc: "Geleneksel lezzet, lokum ile servis edilir.", cat: "icecek" },
            { id: 1, name: "Kola Grubu", price: "30 TL", desc: "Geleneksel lezzet, lokum ile servis edilir.", cat: "icecek" },
            { id: 1, name: "Gazoz Çeşitleri", price: "30 TL", desc: "Geleneksel lezzet, lokum ile servis edilir.", cat: "icecek" },
            { id: 2, name: "Menemen", price: "85 TL", desc: "Soğuk süt, espresso ve buzun mükemmel uyumu.", cat: "yiyecek" },
            { id: 3, name: "Kahvaltı Tabağı", price: "120 TL", desc: "Akışkan çikolata sosu ile birlikte.", cat: "yiyecek" },
            { id: 4, name: "Kaşarlı Tost", price: "140 TL", desc: "Bol meyveli ve taze Belçika çikolatalı.", cat: "yiyecek" },
            { id: 5, name: "Karışık Tost", price: "95 TL", desc: "Özel soslar eşliğinde çıtır patates dilimleri.", cat: "yiyecek" }
        ];

        // 2. URL'DEN MASA NUMARASINI ALMA (Özelleştirme)
        // Eğer link "siteadi.com/?masa=5" ise masa numarasını yakalar
        const urlParams = new URLSearchParams(window.location.search);
        const masaNo = urlParams.get('masa');

        if (masaNo) {
            document.getElementById('table-badge').classList.remove('hidden');
            document.getElementById('table-number').innerText = masaNo;
            
            // Masaya özel karşılama mesajı (Özelleştirilebilir)
            document.getElementById('welcome-message').innerText = `Masa ${masaNo} için dijital menü`;
        }

        // 3. MENÜYÜ EKRANA BASAN FONKSİYON
        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; // İçeriği temizle

            items.forEach(item => {
                const card = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/60 flex justify-between items-center transition hover:shadow-md">
                        <div class="pr-4">
                            <h3 class="font-bold text-stone-900 text-base">${item.name}</h3>
                            <p class="text-xs text-stone-500 mt-1 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="text-right min-w-[70px]">
                            <span class="bg-stone-100 text-neutral-950 font-bold text-sm px-2.5 py-1.5 rounded-xl border border-stone-200">
                                ${item.price}
                            </span>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 4. KATEGORİ FİLTRELEME
        function filterCategory(category) {
            // Buton renklerini sıfırla ve aktif olanı boya
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(btn => {
                btn.className = "bg-white text-stone-700 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95";
            });
            event.target.className = "bg-amber-500 text-neutral-900 font-semibold px-4 py-2 rounded-full text-sm shadow transition active:scale-95";

            if (category === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.cat === category);
                renderMenu(filtered);
            }
        }

        // İlk açılışta tüm menüyü göster
        renderMenu(menuItems);
    </script>
</body>
</html>
